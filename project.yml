name: MacDJ
options:
  bundleIdPrefix: com.forma
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"

targets:
  MacDJ:
    type: application
    platform: macOS
    sources:
      - MacDJ
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.forma.macdj
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: MacDJ/Info.plist
        CODE_SIGN_ENTITLEMENTS: MacDJ/MacDJ.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: MacDJ/Info.plist
      properties:
        LSUIElement: true
        NSMicrophoneUsageDescription: "MacDJ needs microphone access to route your mic into voice calls alongside music."
        CFBundleName: MacDJ
        CFBundleDisplayName: MacDJ
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
    entitlements:
      path: MacDJ/MacDJ.entitlements
      properties:
        com.apple.security.device.audio-input: true
