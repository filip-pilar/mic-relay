name: MicRelay
options:
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"

targets:
  MicRelay:
    type: application
    platform: macOS
    sources:
      - MicRelay
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_NAME: "Mic Relay"
        PRODUCT_BUNDLE_IDENTIFIER: com.micrelay.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: MicRelay/Info.plist
        CODE_SIGN_ENTITLEMENTS: MicRelay/MicRelay.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Mic Relay Local Development
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
