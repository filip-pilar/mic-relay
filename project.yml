name: MicRelay
options:
  bundleIdPrefix: com.micrelay
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

targets:
  MicRelay:
    type: application
    platform: macOS
    sources:
      - MicRelay
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_NAME: "Mic Relay"
        PRODUCT_BUNDLE_IDENTIFIER: com.micrelay.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: MicRelay/Info.plist
        CODE_SIGN_ENTITLEMENTS: MicRelay/MicRelay.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: MicRelay/Info.plist
      properties:
        LSUIElement: true
        NSMicrophoneUsageDescription: "Mic Relay needs microphone access to route your mic into voice calls alongside music."
        NSAudioCaptureUsageDescription: "Mic Relay captures audio from your selected music app so it can feed BlackHole as a virtual microphone."
        NSScreenCaptureUsageDescription: "Mic Relay uses ScreenCaptureKit to capture audio from the selected music app without capturing call audio."
        CFBundleName: "Mic Relay"
        CFBundleDisplayName: "Mic Relay"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
    entitlements:
      path: MicRelay/MicRelay.entitlements
      properties:
        com.apple.security.device.audio-input: true
